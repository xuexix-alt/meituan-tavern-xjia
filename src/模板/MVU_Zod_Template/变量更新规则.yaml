---
变量更新规则:
  日期:
    format: YYYY-MM-DD
    check:
      - 每次长休或剧情明确经过一天时更新
  时间:
    format: HH:MM
    check:
      - 根据剧情流逝更新
  user:
    好感度:
      check:
        - 当发生重要互动时更新
        - 每次变化幅度不超过 10
  物品栏:
    type: |-
      {
        [物品名: string]: {
          描述: string;
          数量: number;
        }
      }
    check:
      - 获得、使用、丢弃物品时更新
      - 数量为 0 时应从物品栏移除
