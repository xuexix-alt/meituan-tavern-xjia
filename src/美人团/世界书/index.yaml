# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/worldbook.zh.json

# 该目录中的每个独立文件都在下方注册为一个世界书条目。
# 核心角色世界观与女孩通用设定.txt 是拆分前的原始合并稿，仅保留作源文件，避免重复注入。
锚点:
  - &常驻设定
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

  - &系统设定
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

  - &关闭设定
    启用: false
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

条目:
  # 从原始合并稿拆出的 5 个模块
  - 名称: 美人团APP设定
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/美人团APP设定

  - 名称: 角色扮演执行协议
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/角色扮演执行协议

  - 名称: 角色扮演规则库
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/角色扮演规则库

  - 名称: 通用设定
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/通用设定

  - 名称: 剧情扮演输出格式
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/剧情扮演输出格式

  # 原目录中已有的变量与输出协议
  - 名称: '[Initvar]'
    <<: *关闭设定
    文件: '美人团外卖3.0beta4/[Initvar]'

  - 名称: '[mvu_update]变量更新格式'
    <<: *系统设定
    文件: '美人团外卖3.0beta4/[mvu_update]变量更新格式'

  - 名称: '[mvu_update]变量更新规则'
    <<: *系统设定
    文件: '美人团外卖3.0beta4/[mvu_update]变量更新规则'

  - 名称: 变量列表
    <<: *系统设定
    文件: 美人团外卖3.0beta4/变量列表

  - 名称: AI输出格式
    <<: *系统设定
    文件: 美人团外卖3.0beta4/AI输出格式

  # 服务流程扩展
  - 名称: 多人服务规则
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/多人服务规则

  - 名称: 再次下单服务规则
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/再次下单服务规则

  - 名称: 服务终结-认知回退协议
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/服务终结-认知回退协议

  # “虐恋风格需要的开”按文件名保持关闭，需使用时可在酒馆中手动开启
  - 名称: 服务终结-（虐恋风格需要的开）
    <<: *关闭设定
    文件: '美人团外卖3.0beta4/服务终结-（虐恋风格需要的开）'

  # 商品分类与后台 APP 版本
  - 名称: 美人团商品分类协议
    <<: *常驻设定
    文件: 美人团外卖3.0beta4/美人团商品分类协议

  - 名称: 'APP的yaml版本（二选一，不那么色但稳定）'
    <<: *常驻设定
    文件: '美人团外卖3.0beta4/APP的yaml版本（二选一，不那么色但稳定）'

  - 名称: 'APP的json版本（二选一，更色但容易截断）'
    <<: *关闭设定
    文件: '美人团外卖3.0beta4/APP的json版本（二选一，更色但容易截断）'

  - 名称: '【APP后台系统触发指南】（别开）'
    <<: *关闭设定
    文件: '美人团外卖3.0beta4/【APP后台系统触发指南】（别开）'
